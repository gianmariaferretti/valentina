      <text x="760" y="305" font-size="24" letter-spacing="5">CASE: V+G / 001</text>
      <rect x="750" y="385" width="330" height="95" fill="none" stroke="#6d3030" stroke-width="9"/>
      <text x="790" y="447" font-size="31" letter-spacing="6">CLASSIFIED</text>
