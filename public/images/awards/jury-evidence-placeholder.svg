<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Classified jury evidence placeholder</title>
  <desc id="desc">An abstract case file and evidence photograph reserved for personal material.</desc>
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9c5a8"/><stop offset="1" stop-color="#a97e60"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#2d201b" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#3a2a27"/>
  <g transform="translate(190 90) rotate(2 610 400)" filter="url(#shadow)">
